<!DOCTYPE html>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
        body{background:linear-gradient(135deg,#E63329 0%,#1C3172 55%,#152559 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;max-width:440px;width:100%;animation:slideUp .45s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
        .head{background:linear-gradient(135deg,#E63329,#1C3172);padding:38px 30px;text-align:center;color:#fff}
        .head i{font-size:56px;margin-bottom:12px;display:block}
        .head h1{font-size:26px;font-weight:900;margin-bottom:6px}
        .head p{font-size:13px;opacity:.85}
        .body{padding:36px 30px}
        .err{background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;padding:12px 15px;border-radius:10px;margin-bottom:18px;font-size:14px;display:flex;align-items:center;gap:10px}
        label{display:block;margin-bottom:7px;color:#1C3172;font-weight:700;font-size:14px}
        .wrap{position:relative;margin-bottom:22px}
        .wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#1C3172;font-size:17px}
        input{width:100%;padding:14px 44px 14px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;transition:all .25s;background:#f9fafb;font-family:'Cairo',sans-serif}
        input:focus{outline:none;border-color:#1C3172;background:#fff;box-shadow:0 0 0 4px rgba(28,49,114,.1)}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,#E63329,#1C3172);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 4px 15px rgba(230,51,41,.35);font-family:'Cairo',sans-serif}
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(230,51,41,.45)}
        .btn:active{transform:translateY(0)}
        .foot{text-align:center;padding:18px;background:#f9fafb;color:#6b7280;font-size:13px;border-top:1px solid #f3f4f6}
    </style>
</head>
<body>
<div class="card">

        <form method="POST" action="/admin/login">
            <input type="hidden" name="_token" value="Qgwve2SWwKYEzZkCMmtxP6f8WOE0ariCjbsX0nZ5" autocomplete="off">            <label>اسم المستخدم</label>
            <div class="wrap">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم" value="" required autofocus>
            </div>
            <label>كلمة المرور</label>
